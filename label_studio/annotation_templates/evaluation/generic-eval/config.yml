    "output": "迁移学习是一种机器学习技术，将在一个任务上训练好的模型作为另一个任务的起点。例如，在 ImageNet 上训练的模型可以微调用于医学图像分类。当目标任务的训练数据有限，但存在相关任务有大量数据时，迁移学习特别有用。当目标领域与源领域差异很大，或者你有充足的数据和算力时，应考虑从头训练。",
