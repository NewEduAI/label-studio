title: 对话评测
type: community
group: Evaluation
order: 2
image: /static/templates/generative-chatbot-assessment.png
details: |
  <h1>多轮对话结构化评分</h1>
  <p>逐轮审查 AI 助手的对话，按角色（用户、助手、工具）分类展示，支持多维度评测打分。适用于 Langfuse 等平台导出的标准对话格式。</p>
  <dl>
    <dt>应用场景</dt>
    <dd>聊天机器人评测、对话式 AI 质量保证、客服 AI 评估、RLHF 数据采集、AI 安全审查</dd>
  </dl>
config: |
  <View>
    <Style>
      .chat-eval-root {
        display: flex;
        gap: var(--spacing-base);
      }

      .chat-eval-left {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: var(--spacing-base);
      }

      .chat-eval-right {
        flex: 1;
        position: sticky;
        top: var(--spacing-base);
        align-self: flex-start;
      }

      .chat-eval-dialogue {
        border: 1px solid var(--color-neutral-border);
        border-radius: var(--corner-radius-medium);
        padding: var(--spacing-base);
        background-color: var(--color-neutral-background);
      }

      .chat-eval-context {
        border: 1px solid var(--color-accent-canteloupe-subtle);
        border-radius: var(--corner-radius-medium);
        padding: var(--spacing-tight);
        background-color: var(--color-accent-canteloupe-subtlest);
        margin-bottom: var(--spacing-base);
      }

      .chat-eval-context .lsf-richtext__container.lsf-htx-richtext {
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-accent-canteloupe-bold);
      }

      .chat-eval-meta {
        border: 1px solid var(--color-neutral-border);
        border-radius: var(--corner-radius-medium);
        padding: var(--spacing-tight);
        background-color: var(--color-neutral-surface);
        font-size: 0.85em;
      }

      .chat-eval-scoring {
        border: 1px solid var(--color-neutral-border);
        border-radius: var(--corner-radius-medium);
        padding: var(--spacing-base);
        background-color: var(--color-neutral-background);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-tight);
      }

      .chat-eval-dim {
        padding: var(--spacing-tight) 0;
        border-bottom: 1px solid var(--color-neutral-border);
      }

      .chat-eval-dim:last-child {
        border-bottom: none;
      }

      .chat-eval-dim-label {
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-neutral-content-subtle);
        margin-bottom: var(--spacing-tighter);
      }
    </Style>

    <View className="chat-eval-root">
      <View className="chat-eval-left">
        <View className="chat-eval-context">
          <Header value="任务背景" size="5"/>
          <Text name="context_display" value="$context"/>
        </View>

        <View className="chat-eval-dialogue">
          <Header value="对话内容" size="4"/>
          <Paragraphs name="dialogue" value="$turns" layout="dialogue" nameKey="role" textKey="content"/>
        </View>

        <View className="chat-eval-meta">
          <Header value="元数据" size="5"/>
          <Text name="metadata_display" value="$metadata_text"/>
        </View>
      </View>

      <View className="chat-eval-right">
        <View className="chat-eval-scoring">
          <Header value="对话评测" size="3"/>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="综合判定" size="5"/></View>
            <Choices name="chat_verdict" toName="dialogue" choice="single" showInline="true" required="true">
              <Choice value="通过"/>
              <Choice value="不通过"/>
              <Choice value="部分通过"/>
            </Choices>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="回复质量" size="5"/></View>
            <Rating name="response_quality" toName="dialogue" maxRating="5"/>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="任务完成度" size="5"/></View>
            <Choices name="task_completion" toName="dialogue" choice="single" showInline="true">
              <Choice value="完全完成"/>
              <Choice value="部分完成"/>
              <Choice value="未完成"/>
              <Choice value="不适用"/>
            </Choices>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="工具使用" size="5"/></View>
            <Choices name="tool_usage" toName="dialogue" choice="single" showInline="true">
              <Choice value="正确"/>
              <Choice value="部分正确"/>
              <Choice value="错误"/>
              <Choice value="不必要"/>
              <Choice value="未使用工具"/>
            </Choices>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="对话质量" size="5"/></View>
            <Choices name="conversation_quality" toName="dialogue" choice="multiple" showInline="true">
              <Choice value="连贯"/>
              <Choice value="有帮助"/>
              <Choice value="简洁"/>
              <Choice value="偏离主题"/>
              <Choice value="内容重复"/>
              <Choice value="幻觉"/>
              <Choice value="不完整"/>
            </Choices>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="问题严重程度" size="5"/></View>
            <Choices name="issue_severity" toName="dialogue" choice="single" showInline="true">
              <Choice value="无问题"/>
              <Choice value="轻微"/>
              <Choice value="严重"/>
              <Choice value="致命"/>
            </Choices>
          </View>

          <View className="chat-eval-dim">
            <View className="chat-eval-dim-label"><Header value="备注" size="5"/></View>
            <TextArea name="chat_comments" toName="dialogue" rows="3" placeholder="针对具体轮次的说明、预期行为..."/>
          </View>
        </View>
      </View>
    </View>
  </View>

