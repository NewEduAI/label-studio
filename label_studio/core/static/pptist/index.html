<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #canvas-container {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="ppt-canvas"></canvas>
    </div>
    <script src="viewer.js"></script>
</body>
</html>
